name: Deploy VitePress site to Pages & Host

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare SEO, Fonts & Server Config (.htaccess) Automatically
        run: |
          # ۱. حذف خودکار صفحات آزمایشی تکراری برای رفع خطای سرچ کنسول
          rm -f api-examples.md markdown-examples.md public/api-examples.html public/markdown-examples.html

          # ۲. ساخت خودکار robots.txt استاندارد
          cat << 'EOF' > public/robots.txt
          User-agent: *
          Allow: /

          Sitemap: https://playpedia.ir/sitemap.xml
          EOF

          # ۳. ساخت خودکار فایل .htaccess برای پشتیبانی از لینک‌های بدون .html در هاست ایران
          cat << 'EOF' > public/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            RewriteRule ^(api-examples|markdown-examples)(\.html)?$ / [R=301,L]

            RewriteCond %{THE_REQUEST} \s/+(.+?)\.html[\s?] [NC]
            RewriteRule ^ /%1 [R=301,L,NE]

            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{DOCUMENT_ROOT}/$1.html -f
            RewriteRule ^(.+?)/?$ /$1.html [L]
          </IfModule>

          ErrorDocument 404 /404.html
          EOF

          # ۴. دانلود خودکار فونت وزیرمتن داخل هاست برای لود بدون اختلال در ایران
          mkdir -p public/fonts
          curl -sL "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2" -o public/fonts/Vazirmatn-Regular.woff2 || true
          curl -sL "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2" -o public/fonts/Vazirmatn-Bold.woff2 || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      - name: Ensure .htaccess is in dist
        run: cp -f public/.htaccess .vitepress/dist/.htaccess

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

      - name: Auto-Deploy to Iranian Host via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.vitepress/dist/
          server-dir: ./
          security: loose

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        id: deployment
        uses: actions/deploy-pages@v4

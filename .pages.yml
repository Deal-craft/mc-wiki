media:
  input: public/images
  output: /images

content:
  - name: articles
    label: مقالات و صفحات پلی‌پدیا
    type: collection
    path: ""
    filename: "{fields.slug}.md"
    view:
      fields: [ title, date ]
    fields:
      - name: slug
        label: آدرس صفحه در مرورگر (URL انگلیسی - مثلا best-shaders)
        type: string
        description: فقط حروف انگلیسی کوچک و خط تیره بنویسید تا آدرس صفحه ساخته شود
        required: true
      - name: title
        label: عنوان سئو (Title - نمایش در نتایج گوگل)
        type: string
        required: true
      - name: description
        label: توضیحات سئو (Meta Description - خلاصه زیر لینک در گوگل)
        type: text
        required: true
      - name: date
        label: تاریخ انتشار یا آپدیت
        type: date
      - name: body
        label: متن کامل مقاله
        type: rich-text
- name: date
        label: تاریخ انتشار
        type: date
        required: true
      - name: category
        label: انتخاب هاب (دسته‌بندی مقاله)
        type: select
        required: true
        options:
          values:
            - value: servers
              label: 🌐 هاب سرورها
            - value: mods
              label: 📦 هاب ماد و شیدرپک
            - value: farms
              label: 🌾 هاب فارم‌ها
            - value: errors
              label: ⚡ هاب رفع ارور و لانچر
      - name: badge
        label: برچسب کوتاه (مثلاً 1.21 Java)
        type: string
